# Public-facing server. Only these paths exist:
#   /                static page (index.html, app.js, style.css)
#   /buddy.json      latest counts (no answers)
#   /api/sync        POST, asks the collector to refresh (rate limited)
#   /api/status      GET, sync state
# Everything else is a 404. The collector's /admin pages are never proxied;
# they're published on 127.0.0.1 only (see docker-compose.yml).
# Note: any add_header in a location replaces the server-level ones, so
# locations that set Cache-Control re-include the security headers.

limit_req_zone $binary_remote_addr zone=sync:1m rate=20r/m;
limit_req_zone $binary_remote_addr zone=status:1m rate=180r/m;
limit_req_status 429;

server {
    listen 80;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;

    # Resolve the collector lazily via Docker DNS, so nginx starts even if it's down.
    resolver 127.0.0.11 valid=30s ipv6=off;
    set $collector http://collector:8000;

    include /etc/nginx/snippets/headers.conf;

    location = / {
        try_files /index.html =404;
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/snippets/headers.conf;
    }

    location ~ ^/(app\.js|style\.css|favicon\.svg)$ {
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/snippets/headers.conf;
    }

    location = /robots.txt {
        default_type text/plain;
        return 200 "User-agent: *\nDisallow: /\n";
    }

    location = /buddy.json {
        alias /public/buddy.json;
        default_type application/json;
        add_header Cache-Control "no-store" always;
        include /etc/nginx/snippets/headers.conf;
    }

    location = /api/sync {
        limit_except POST { deny all; }
        limit_req zone=sync burst=5 nodelay;
        proxy_pass $collector/sync;
        proxy_set_header Host collector;
        proxy_read_timeout 10s;
    }

    location = /api/status {
        limit_except GET { deny all; }
        limit_req zone=status burst=30 nodelay;
        proxy_pass $collector/status;
        proxy_set_header Host collector;
        proxy_read_timeout 10s;
        add_header Cache-Control "no-store" always;
        include /etc/nginx/snippets/headers.conf;
    }

    location / {
        return 404;
    }
}
