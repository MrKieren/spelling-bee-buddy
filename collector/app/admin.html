<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Bee Buddy admin</title>
<style>
  :root {
    --bg: #f6f5f1; --card: #fff; --text: #1c1b18; --muted: #74716a; --line: #e4e1d8;
    --bee: #f7da21; --ok: #3b8f4f; --warn: #c07a12; --err: #c0392b;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    color-scheme: light dark;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #141412; --card: #1e1d1a; --text: #efede6; --muted: #9b978d; --line: #34322d; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); }
  main { max-width: 560px; margin: 0 auto; padding: 24px 16px; }
  h1 { font-size: 1.3rem; margin: 0 0 4px; }
  h2 { font-size: 1rem; margin: 0 0 12px; }
  .muted { color: var(--muted); font-size: .9rem; margin: 0 0 16px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 16px; margin-bottom: 14px; }
  dl { display: grid; grid-template-columns: max-content 1fr; gap: 8px 16px; margin: 0; }
  dt { color: var(--muted); font-size: .9rem; }
  dd { margin: 0; font-weight: 600; }
  .pill { display: inline-flex; align-items: center; gap: 6px; }
  .pill::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
  .pill.ok::before { background: var(--ok); }
  .pill.warn::before { background: var(--warn); }
  .pill.err::before { background: var(--err); }
  ol { margin: 0 0 14px; padding-left: 1.2em; color: var(--muted); line-height: 1.6; font-size: .92rem; }
  form { display: grid; gap: 10px; }
  label { font-size: .85rem; font-weight: 600; display: grid; gap: 4px; }
  input {
    font: inherit; padding: 10px; border-radius: 8px; border: 1px solid var(--line);
    background: var(--bg); color: var(--text); width: 100%;
  }
  button {
    font: inherit; font-weight: 600; padding: 10px 14px; border: 0; border-radius: 8px;
    background: var(--bee); color: #1c1b18; cursor: pointer;
  }
  button.secondary { background: var(--line); color: var(--text); }
  button[disabled] { opacity: .6; cursor: default; }
  .msg { margin: 0; min-height: 1.2em; font-size: .9rem; }
  .msg.ok { color: var(--ok); } .msg.err { color: var(--err); }
  .row { display: flex; gap: 10px; align-items: center; justify-content: space-between; }
</style>
</head>
<body>
<main>
  <h1>Bee Buddy admin</h1>
  <p class="muted">Only reachable from this computer. The public page is unaffected.</p>

  <section class="card">
    <div class="row"><h2>Status</h2><button type="button" id="sync" class="secondary">Sync now</button></div>
    <dl>
      <dt>NYT login</dt><dd id="d-login">…</dd>
      <dt>Last sync</dt><dd id="d-sync">…</dd>
      <dt>Progress</dt><dd id="d-progress">…</dd>
    </dl>
  </section>

  <section class="card">
    <h2>Update NYT cookie</h2>
    <ol>
      <li>Log in at nytimes.com in Firefox.</li>
      <li>Press F12 → Storage → Cookies → https://www.nytimes.com.</li>
      <li>Copy the value of <b>NYT-S</b> and paste it here.</li>
    </ol>
    <form id="form" autocomplete="off">
      <label>NYT-S cookie value
        <input id="value" type="password" required spellcheck="false" autocapitalize="off">
      </label>
      <button type="submit" id="save">Save and sync</button>
      <p id="msg" class="msg" role="alert"></p>
    </form>
  </section>
</main>
<script>
"use strict";
const $ = (id) => document.getElementById(id);
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

function ago(iso) {
  if (!iso) return "never";
  const s = Math.max(0, Math.round((Date.now() - new Date(iso)) / 1000));
  return s < 60 ? `${s}s ago` : s < 3600 ? `${Math.round(s / 60)} min ago` : `${Math.round(s / 3600)} h ago`;
}

function pill(el, text, cls) {
  el.textContent = text;
  el.className = `pill ${cls}`;
}

async function getState() {
  const r = await fetch("/admin/state", { cache: "no-store" });
  return r.json();
}

function render(st) {
  const demo = st.fake ? " (demo mode)" : "";
  if (st.logged_in === true) pill($("d-login"), "Logged in" + demo, "ok");
  else if (st.logged_in === false) pill($("d-login"), "Not logged in" + demo, "err");
  else pill($("d-login"), "Unknown (no sync yet)", "");
  const sync = st.running ? "running…" : st.status === "error" ? `failed (${ago(st.updated_at)} last good)` : ago(st.updated_at);
  pill($("d-sync"), sync, st.running ? "warn" : st.status === "error" ? "err" : "ok");
  $("d-progress").textContent = st.total_words != null
    ? `${st.found_words} / ${st.total_words} words · ${st.rank}` : "–";
}

async function refresh() {
  try { render(await getState()); } catch { pill($("d-sync"), "collector not responding", "err"); }
}

async function waitForSync() {
  let st = await getState();
  for (let i = 0; i < 60 && st.running; i++) { await sleep(2000); st = await getState(); render(st); }
  render(st);
  return st;
}

function msg(text, cls = "") { $("msg").textContent = text; $("msg").className = `msg ${cls}`; }

$("sync").addEventListener("click", async () => {
  $("sync").disabled = true;
  await fetch("/admin/sync", { method: "POST" });
  await waitForSync();
  $("sync").disabled = false;
});

$("form").addEventListener("submit", async (e) => {
  e.preventDefault();
  $("save").disabled = true;
  msg("Saving…");
  try {
    const r = await fetch("/admin/cookie", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ value: $("value").value }),
    });
    if (!r.ok) {
      let detail = `Couldn't save (error ${r.status}).`;
      try { const b = await r.json(); if (typeof b.detail === "string") detail = b.detail; } catch {}
      msg(detail, "err");
      return;
    }
    $("value").value = "";
    msg("Saved. Checking with NYT…");
    await sleep(500);
    const st = await waitForSync();
    if (st.logged_in) msg("Logged in. The public page will show your progress.", "ok");
    else msg("NYT didn't accept that cookie. Copy a fresh NYT-S value and try again.", "err");
  } catch {
    msg("Couldn't reach the collector.", "err");
  } finally {
    $("save").disabled = false;
  }
});

refresh();
setInterval(refresh, 10000);
</script>
</body>
</html>
